<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Texas Flame Works Private Collection"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>Private Collection | Texas FlameWorks</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ==================================================
       RESET
    ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #ffffff;

      font-family: "DM Sans", sans-serif;

      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* ==================================================
       PRIVATE ACCESS SCREEN
    ================================================== */

    .access-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #050505;

      overflow: hidden;

      z-index: 1000;
    }


    /* ==================================================
       FIREPLACE BACKGROUND VIDEO
    ================================================== */

    .fireplace-video {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 100%;
      height: 100%;

      min-width: 100%;
      min-height: 100%;

      object-fit: cover;
      object-position: center center;

      transform: translate(-50%, -50%) scale(1.02);

      z-index: 0;

      pointer-events: none;
    }


    /* ==================================================
       CINEMATIC VIDEO OVERLAY
    ================================================== */

    .video-overlay {
      position: absolute;
      inset: 0;

      z-index: 1;

      background:

        radial-gradient(
          circle at 50% 60%,
          rgba(255, 115, 38, 0.04),
          transparent 40%
        ),

        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.30) 0%,
          rgba(0, 0, 0, 0.10) 40%,
          rgba(0, 0, 0, 0.62) 100%
        ),

        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.52) 0%,
          rgba(0, 0, 0, 0.06) 50%,
          rgba(0, 0, 0, 0.52) 100%
        );

      pointer-events: none;
    }


    /* SLIGHT VIGNETTE */

    .video-vignette {
      position: absolute;
      inset: 0;

      z-index: 2;

      box-shadow:
        inset 0 0 180px rgba(0, 0, 0, 0.45);

      pointer-events: none;
    }


    /* ==================================================
       TOP BRAND
    ================================================== */

    .brand {
      position: absolute;

      top: 31px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      white-space: nowrap;

      font-family: "Manrope", sans-serif;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 0.30em;

      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.94);
    }


    /* ==================================================
       RETURN BUTTON
    ================================================== */

    .back-link {
      position: absolute;

      top: 32px;
      left: 38px;

      z-index: 10;

      display: flex;
      align-items: center;
      gap: 10px;

      color: rgba(255, 255, 255, 0.58);

      text-decoration: none;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 0.20em;

      text-transform: uppercase;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .back-link:hover {
      color: #ffffff;
      transform: translateX(-3px);
    }


    /* ==================================================
       ACCESS PANEL
    ================================================== */

    .access-panel {
      position: relative;

      z-index: 5;

      width: min(100%, 515px);

      padding: 54px 42px 44px;

      text-align: center;

      background: rgba(5, 5, 5, 0.35);

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 3px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.42);

      animation:
        panelEntrance
        1.1s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }


    @keyframes panelEntrance {

      0% {
        opacity: 0;
        transform: translateY(22px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* ==================================================
       EYEBROW
    ================================================== */

    .eyebrow {
      display: block;

      margin-bottom: 20px;

      color: rgba(255, 255, 255, 0.50);

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 0.34em;

      text-transform: uppercase;
    }


    /* ==================================================
       TITLE
    ================================================== */

    .access-panel h1 {
      max-width: 430px;

      margin: 0 auto;

      font-family: "Manrope", sans-serif;

      font-size: clamp(
        40px,
        5vw,
        61px
      );

      font-weight: 300;

      line-height: 0.98;

      letter-spacing: -0.048em;

      color: #ffffff;
    }


    /* ==================================================
       DESCRIPTION
    ================================================== */

    .access-panel p {
      max-width: 355px;

      margin:
        25px
        auto
        0;

      color:
        rgba(255, 255, 255, 0.58);

      font-size: 13px;

      font-weight: 300;

      line-height: 1.75;
    }


    /* ==================================================
       FORM
    ================================================== */

    .code-form {
      margin-top: 38px;
    }


    /* ==================================================
       4 DIGIT INPUT
    ================================================== */

    .code-inputs {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      width: 100%;

      max-width: 330px;

      margin: 0 auto;
    }


    .digit-input {
      width: 100%;

      height: 75px;

      border:
        1px solid
        rgba(255, 255, 255, 0.14);

      border-radius: 2px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.045);

      color: #ffffff;

      text-align: center;

      font-family:
        "Manrope",
        sans-serif;

      font-size: 25px;

      font-weight: 300;

      caret-color:
        rgba(255, 173, 107, 0.9);

      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .digit-input:hover {
      background:
        rgba(255, 255, 255, 0.065);
    }


    .digit-input:focus {

      border-color:
        rgba(255, 174, 105, 0.75);

      background:
        rgba(255, 255, 255, 0.085);

      transform:
        translateY(-2px);

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.18);
    }


    /* ==================================================
       ENTER BUTTON
    ================================================== */

    .enter-btn {
      position: relative;

      width: 100%;

      max-width: 330px;

      margin-top: 12px;

      padding:
        17px
        22px;

      overflow: hidden;

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      border-radius: 2px;

      background:
        rgba(255, 255, 255, 0.94);

      color: #111111;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.20em;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }


    .enter-btn:hover {

      background: #ffffff;

      transform:
        translateY(-2px);
    }


    /* ==================================================
       ERROR MESSAGE
    ================================================== */

    .error-message {

      min-height: 20px;

      margin-top: 15px;

      color: #e7a276;

      font-size: 10px;

      font-weight: 400;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      opacity: 0;

      transform:
        translateY(-3px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }


    .error-message.visible {

      opacity: 1;

      transform:
        translateY(0);
    }


    /* ==================================================
       SHAKE IF WRONG CODE
    ================================================== */

    .access-panel.shake {

      animation:
        wrongCode
        0.4s
        ease;
    }


    @keyframes wrongCode {

      0% {
        transform:
          translateX(0);
      }

      20% {
        transform:
          translateX(-7px);
      }

      40% {
        transform:
          translateX(7px);
      }

      60% {
        transform:
          translateX(-5px);
      }

      80% {
        transform:
          translateX(5px);
      }

      100% {
        transform:
          translateX(0);
      }

    }


    /* ==================================================
       INVITATION LABEL
    ================================================== */

    .private-label {

      position: absolute;

      bottom: 28px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 10;

      color:
        rgba(255, 255, 255, 0.35);

      white-space: nowrap;

      font-size: 8px;

      font-weight: 500;

      letter-spacing: 0.30em;

      text-transform: uppercase;
    }


    /* ==================================================
       UNLOCK MESSAGE
    ================================================== */

    .unlock-message {

      position: fixed;

      inset: 0;

      z-index: 2000;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #050505;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }


    .unlock-message.active {

      opacity: 1;

      visibility: visible;
    }


    .unlock-inner {

      text-align: center;

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 0.7s ease 0.2s,
        transform 0.7s ease 0.2s;
    }


    .unlock-message.active
    .unlock-inner {

      opacity: 1;

      transform:
        translateY(0);
    }


    .unlock-small {

      display: block;

      margin-bottom: 13px;

      color:
        rgba(255, 255, 255, 0.38);

      font-size: 8px;

      letter-spacing: 0.34em;

      text-transform: uppercase;
    }


    .unlock-title {

      font-family:
        "Manrope",
        sans-serif;

      font-size:
        clamp(
          32px,
          5vw,
          60px
        );

      font-weight: 300;

      letter-spacing:
        -0.04em;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media
    (max-width: 700px) {

      .access-screen {

        padding:
          20px;

        align-items:
          center;
      }


      .fireplace-video {

        object-position:
          center center;

        transform:
          translate(-50%, -50%)
          scale(1.04);
      }


      .brand {

        top:
          max(
            23px,
            env(safe-area-inset-top)
          );

        font-size:
          10px;

        letter-spacing:
          0.24em;
      }


      .back-link {

        top: auto;

        left: 50%;

        bottom: 60px;

        transform:
          translateX(-50%);

        font-size:
          8px;
      }


      .back-link:hover {

        transform:
          translateX(-50%);
      }


      .access-panel {

        width: 100%;

        padding:
          42px
          20px
          34px;

        background:
          rgba(5, 5, 5, 0.42);

        backdrop-filter:
          blur(15px);

        -webkit-backdrop-filter:
          blur(15px);
      }


      .eyebrow {

        margin-bottom:
          17px;

        font-size:
          8px;
      }


      .access-panel h1 {

        font-size:
          clamp(
            37px,
            11vw,
            48px
          );
      }


      .access-panel p {

        max-width:
          300px;

        margin-top:
          20px;

        font-size:
          12px;

        line-height:
          1.65;
      }


      .code-form {

        margin-top:
          30px;
      }


      .code-inputs {

        max-width:
          300px;

        gap:
          8px;
      }


      .digit-input {

        height:
          66px;

        font-size:
          22px;
      }


      .enter-btn {

        max-width:
          300px;

        padding:
          16px
          15px;

        font-size:
          9px;
      }


      .private-label {

        bottom:
          25px;

        font-size:
          7px;
      }

    }


    /* ==================================================
       SMALL MOBILE
    ================================================== */

    @media
    (max-width: 380px) {

      .access-panel {

        padding:
          35px
          16px
          28px;
      }


      .access-panel h1 {

        font-size:
          35px;
      }


      .digit-input {

        height:
          59px;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       PRIVATE ACCESS
  ================================================== -->

  <main
    class="access-screen"
    id="accessScreen"
  >


    <!-- FIREPLACE VIDEO -->

    <video
      class="fireplace-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >

      <source
        src="assets/fireplacevideo.mp4"
        type="video/mp4"
      >

    </video>


    <!-- VIDEO OVERLAYS -->

    <div
      class="video-overlay"
    ></div>

    <div
      class="video-vignette"
    ></div>


    <!-- RETURN -->




    <!-- BRAND -->

    <div class="brand">
      Texas Flame Works
    </div>


    <!-- ACCESS PANEL -->

    <section
      class="access-panel"
      id="accessPanel"
    >


      <span
        class="eyebrow"
      >
        Private Collection
      </span>


      <h1>
        Beyond the flame.
      </h1>


      <p>
        A private look into our most
        refined fire features and custom creations.
      </p>


      <!-- CODE FORM -->

      <form
        class="code-form"
        id="codeForm"
      >


        <div
          class="code-inputs"
        >


          <input
            class="digit-input"
            type="text"
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            aria-label="Access code digit 1"
          >


          <input
            class="digit-input"
            type="text"
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            aria-label="Access code digit 2"
          >


          <input
            class="digit-input"
            type="text"
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            aria-label="Access code digit 3"
          >


          <input
            class="digit-input"
            type="text"
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            aria-label="Access code digit 4"
          >


        </div>


        <button
          class="enter-btn"
          type="submit"
        >
          Enter Private Site
        </button>


        <div
          class="error-message"
          id="errorMessage"
        >
          Incorrect access code
        </div>


      </form>


    </section>


    <!-- BOTTOM TEXT -->

  


  </main>


  <!-- ==================================================
       UNLOCK TRANSITION
  ================================================== -->

  <div
    class="unlock-message"
    id="unlockMessage"
  >

    <div
      class="unlock-inner"
    >

      <span
        class="unlock-small"
      >
        Access Granted
      </span>

      <div
        class="unlock-title"
      >
        Texas Flame Works
      </div>

    </div>

  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script>

    /* ==================================================
       SETTINGS

       CHANGE YOUR 4 DIGIT CODE HERE
    ================================================== */

    const PRIVATE_CODE = "0206";


    /*
      This is the page that opens
      after the correct code.
    */

    const PRIVATE_SITE =
      "private-home.html";


    /* ==================================================
       ELEMENTS
    ================================================== */

    const form =
      document.getElementById(
        "codeForm"
      );


    const inputs =
      [
        ...document.querySelectorAll(
          ".digit-input"
        )
      ];


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const accessPanel =
      document.getElementById(
        "accessPanel"
      );


    const unlockMessage =
      document.getElementById(
        "unlockMessage"
      );


    /* ==================================================
       NUMERIC INPUT
    ================================================== */

    inputs.forEach(
      (input, index) => {


        input.addEventListener(
          "input",
          () => {

            /*
              Only allow numbers
            */

            input.value =
              input.value.replace(
                /\D/g,
                ""
              );


            /*
              Hide previous error
            */

            errorMessage
              .classList
              .remove(
                "visible"
              );


            /*
              Move automatically
              to next box
            */

            if (
              input.value &&
              index <
              inputs.length - 1
            ) {

              inputs[
                index + 1
              ].focus();

            }


            /*
              Automatically submit
              once all 4 digits
              are entered
            */

            const completeCode =
              inputs
                .map(
                  item =>
                    item.value
                )
                .join("");


            if (
              completeCode.length === 4
            ) {

              setTimeout(
                () => {

                  checkCode();

                },
                120
              );

            }

          }
        );


        /* ===============================================
           BACKSPACE
        =============================================== */

        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key ===
                "Backspace" &&
              !input.value &&
              index > 0
            ) {

              inputs[
                index - 1
              ].focus();

            }

          }
        );


        /* ===============================================
           PASTE 4 DIGIT CODE
        =============================================== */

        input.addEventListener(
          "paste",
          event => {

            event.preventDefault();


            const pasted =
              event.clipboardData
                .getData("text")
                .replace(
                  /\D/g,
                  ""
                )
                .slice(
                  0,
                  4
                );


            pasted
              .split("")
              .forEach(
                (number, i) => {

                  if (
                    inputs[i]
                  ) {

                    inputs[i]
                      .value =
                        number;

                  }

                }
              );


            if (
              pasted.length === 4
            ) {

              inputs[3]
                .focus();


              setTimeout(
                () => {

                  checkCode();

                },
                150
              );

            }

          }
        );

      }
    );


    /* ==================================================
       FORM SUBMIT
    ================================================== */

    form.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        checkCode();

      }
    );


    /* ==================================================
       CHECK CODE
    ================================================== */

    function checkCode() {


      const enteredCode =
        inputs
          .map(
            input =>
              input.value
          )
          .join("");


      /*
        Don't check until
        all 4 numbers exist
      */

      if (
        enteredCode.length < 4
      ) {

        return;

      }


      /* ===============================================
         CORRECT CODE
      =============================================== */

      if (
        enteredCode ===
        PRIVATE_CODE
      ) {


        /*
          Save access for
          this browser session
        */

        sessionStorage.setItem(
          "texasFlameWorksAccess",
          "approved"
        );


        /*
          Show luxury transition
        */

        unlockMessage
          .classList
          .add(
            "active"
          );


        /*
          Open private homepage
        */

        setTimeout(
          () => {

            window.location.href =
              PRIVATE_SITE;

          },
          1500
        );


      }


      /* ===============================================
         WRONG CODE
      =============================================== */

      else {


        errorMessage
          .classList
          .add(
            "visible"
          );


        accessPanel
          .classList
          .remove(
            "shake"
          );


        void accessPanel
          .offsetWidth;


        accessPanel
          .classList
          .add(
            "shake"
          );


        inputs.forEach(
          input => {

            input.value = "";

          }
        );


        setTimeout(
          () => {

            inputs[0]
              .focus();

          },
          100
        );


      }

    }


    /* ==================================================
       VIDEO AUTOPLAY FALLBACK
    ================================================== */

    window.addEventListener(
      "load",
      () => {


        const video =
          document.querySelector(
            ".fireplace-video"
          );


        if (video) {

          video
            .play()
            .catch(
              () => {

                /*
                  Some browsers may
                  initially block playback.
                */

              }
            );

        }


        /*
          Focus first code box
          on desktop.
        */

        if (
          window.innerWidth > 700
        ) {

          setTimeout(
            () => {

              inputs[0]
                .focus();

            },
            700
          );

        }

      }
    );


  </script>


</body>
</html>
