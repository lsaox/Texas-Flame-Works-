<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="robots" content="noindex">

  <title>Thank You | Texas FlameWorks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&family=Rye&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --black: #080908;
      --white: #f4f0e8;
      --muted: rgba(244, 240, 232, .55);
      --line: rgba(244, 240, 232, .16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--black);
      color: var(--white);

      font-family: "DM Sans", sans-serif;

      padding: 30px;
    }

    .thank-you {
      width: min(650px, 100%);

      text-align: center;
    }

    .brand {
      margin-bottom: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
    }

    .brand-mark {
      font-family: "Rye", serif;

      font-size: 1.3rem;
    }

    .brand-name {
      font-size: .7rem;

      letter-spacing: .14em;

      text-transform: uppercase;
    }

    .kicker {
      margin-bottom: 22px;

      color: rgba(244, 240, 232, .38);

      font-size: .52rem;
      font-weight: 600;

      letter-spacing: .22em;

      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 27px;

      font-family:
        "Libre Caslon Display",
        Georgia,
        serif;

      font-size:
        clamp(
          4.5rem,
          10vw,
          7.5rem
        );

      font-weight: 400;

      line-height: .88;

      letter-spacing: -.055em;
    }

    .message {
      max-width: 480px;

      margin:
        0 auto
        42px;

      color: var(--muted);

      font-size: .88rem;

      line-height: 1.8;
    }

    .return {
      display: inline-flex;

      align-items: center;

      gap: 22px;

      padding:
        17px
        21px;

      border:
        1px solid var(--line);

      color: var(--white);

      text-decoration: none;

      font-size: .54rem;
      font-weight: 600;

      letter-spacing: .18em;

      text-transform: uppercase;

      transition:
        background .3s ease,
        color .3s ease,
        gap .3s ease;
    }

    .return:hover {
      background: var(--white);
      color: var(--black);

      gap: 29px;
    }

    @media (max-width: 600px) {

      .brand {
        margin-bottom: 50px;
      }

      h1 {
        font-size: clamp(4rem, 20vw, 5.5rem);
      }

      .message {
        max-width: 34ch;

        font-size: .82rem;
      }

    }

  </style>
</head>

<body>

  <main class="thank-you">

    <div class="brand">

      <span class="brand-mark">
        TF
      </span>

      <span class="brand-name">
        Texas FlameWorks
      </span>

    </div>


    <div class="kicker">
      Inquiry Received
    </div>


    <h1>
      Thank you.
    </h1>


    <p class="message">
      We've received your project details. Our team will
      review your inquiry and reach out to discuss your
      fireplace project and next steps.
    </p>


    <a
      href="private-home.html"
      class="return"
    >
      Return Home

      <span>↗</span>
    </a>

  </main>

</body>
</html>
